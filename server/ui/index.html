<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Helpdesk Schedule Manager</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      :root {
        --gap: 12px;
        --pad: 14px;
        --radius: 10px;
        --border: 1px solid #ddd;
        --accent: #0066ff;
        --accent-light: #e3f2fd;
        --bg: #fafafa;
        --danger: #d32f2f;
        --ok: #2e7d32;
      }
      * {
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, sans-serif;
        background: var(--bg);
        color: #222;
        margin: 0;
        padding: 24px;
        max-width: 1100px;
        margin-inline: auto;
      }
      h1 {
        margin: 0 0 24px;
        font-size: 1.6rem;
      }
      section h3 {
        margin-top: 0;
        border-bottom: var(--border);
        padding-bottom: 6px;
      }
      .card {
        background: white;
        border: var(--border);
        border-radius: var(--radius);
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
        padding: var(--pad);
        margin-bottom: 20px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.95rem;
      }
      th,
      td {
        border-bottom: var(--border);
        padding: 6px 8px;
      }
      th {
        text-align: left;
        background: #f7f7f7;
      }
      input,
      select,
      button {
        border: 1px solid #ccc;
        border-radius: 6px;
        padding: 6px 8px;
        font: inherit;
      }
      input[type="datetime-local"] {
        width: 180px;
      }
      button {
        cursor: pointer;
        transition:
          0.2s background,
          0.2s color;
      }
      button.primary {
        background: var(--accent);
        color: white;
        border: none;
      }
      button.primary:hover {
        background: #004de0;
      }
      button.danger {
        background: var(--danger);
        color: white;
        border: none;
      }
      button.danger:hover {
        background: #b71c1c;
      }
      button.secondary {
        background: #f2f2f2;
      }
      button.secondary:hover {
        background: #e0e0e0;
      }
      .toolbar {
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 12px;
      }
      .toolbar > div {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        background: var(--accent-light);
        border-radius: 12px;
        padding: 4px 8px;
        margin: 2px;
        font-family: ui-monospace, SFMono-Regular, monospace;
      }
      .chip button {
        margin-left: 4px;
        background: transparent;
        border: none;
        color: #555;
        font-weight: bold;
      }
      .chip button:hover {
        color: var(--danger);
      }
      #status-bar {
        font-size: 0.95rem;
        color: #333;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
      }
      .badge {
        display: inline-block;
        background: var(--accent);
        color: white;
        padding: 3px 7px;
        border-radius: 8px;
        font-size: 0.8em;
        margin-left: 4px;
      }
      #msg {
        transition: opacity 0.3s;
        margin-top: 10px;
        min-height: 1.2em;
      }
      #msg.ok {
        color: var(--ok);
      }
      #msg.error {
        color: var(--danger);
      }
      .fade {
        opacity: 0.5;
      }
      @media (max-width: 850px) {
        body {
          padding: 12px;
        }
        input[type="datetime-local"] {
          width: 100%;
        }
        table {
          font-size: 0.85rem;
        }
      }
    </style>
  </head>
  <body>
    <h1>Helpdesk Schedule Manager</h1>

    <div class="card" id="status-bar">
      <div>Loading status…</div>
      <div><span class="muted">Updated just now</span></div>
    </div>

    <div class="card">
      <div class="toolbar">
        <div>
          <button id="reload" class="secondary">⟳ Reload</button>
          <button id="export" class="secondary">⇩ Export</button>
        </div>
        <div>
          <button id="add-shift" class="secondary">+ Add Shift</button>
          <button id="save" class="primary">Save All</button>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px">
        <section>
          <h3>Upcoming & Current Shifts</h3>
          <table>
            <thead>
              <tr>
                <th>Start</th>
                <th>End</th>
                <th>Users</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="shift-rows"></tbody>
          </table>
        </section>

        <section>
          <h3>Volunteers Pool</h3>
          <div id="vol-list"></div>
          <div style="margin-top: 10px; display: flex; gap: 8px">
            <input id="vol-id" placeholder="Discord user ID" />
            <button id="add-vol" class="secondary">Add</button>
          </div>
        </section>
      </div>

      <div id="msg" class="muted"></div>
    </div>

    <script>
      let shifts = [];
      let volunteers = [];
      let organizers = [];
      const el = (id) => document.getElementById(id);

      const fmtDT = (unix) => {
        const d = new Date(unix * 1000);
        const pad = (n) => String(n).padStart(2, "0");
        return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(
          d.getDate(),
        )}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
      };
      const parseDT = (v) => Math.floor(new Date(v).getTime() / 1000);

      const msg = (t, ok = false) => {
        const e = el("msg");
        e.textContent = t;
        e.className = ok ? "ok" : "error";
        setTimeout(() => (e.className = "muted fade"), 4000);
      };

      async function api(path, opts = {}) {
        const r = await fetch(path, {
          headers: { "Content-Type": "application/json" },
          ...opts,
        });
        if (!r.ok) throw new Error(await r.text());
        return r.headers.get("content-type")?.includes("json")
          ? r.json()
          : r.text();
      }

      async function loadAll() {
        try {
          const [sh, vols, orgs, st] = await Promise.all([
            api("/api/schedule"),
            api("/api/volunteers"),
            api("/api/organizers"),
            api("/api/status").catch(() => null),
          ]);
          shifts = sh;
          volunteers = vols;
          organizers = orgs;
          renderStatus(st);
          render();
          msg("✅ Data loaded", true);
        } catch (e) {
          msg("❌ Load failed: " + e.message, false);
        }
      }

      function renderStatus(st) {
        const now = st ? new Date(st.now * 1000).toLocaleString() : "—";
        const cur =
          st && st.cur?.start
            ? `${st.cur.user_ids.length} active`
            : "none active";
        const next =
          st && st.next?.start
            ? new Date(st.next.start * 1000).toLocaleTimeString()
            : "none upcoming";
        el("status-bar").innerHTML = `
          <div>Now: <b>${now}</b> | Current: <b>${cur}</b> | Next: <b>${next}</b></div>
          <div class="muted">Last updated: ${new Date().toLocaleTimeString()}</div>
        `;
      }

      function render() {
        const tbody = el("shift-rows");
        tbody.innerHTML = "";
        shifts.forEach((s, i) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td><input type="datetime-local" value="${fmtDT(s.start)}" data-k="start" /></td>
            <td><input type="datetime-local" value="${fmtDT(s.end)}" data-k="end" /></td>
            <td class="users"></td>
            <td style="text-align:right">
              <button data-act="update" class="secondary">Save</button>
              <button data-act="delete" class="danger">×</button>
            </td>
          `;
          tbody.appendChild(tr);
          renderUsers(tr.querySelector(".users"), s.user_ids, i);

          tr.querySelector('[data-act="update"]').onclick = async () => {
            const start = parseDT(tr.querySelector('[data-k="start"]').value);
            const end = parseDT(tr.querySelector('[data-k="end"]').value);
            const users = shifts[i].user_ids;
            if (end <= start) return msg("End must be after start.");
            await api(`/api/shift/${i}`, {
              method: "PUT",
              body: JSON.stringify({ start, end, user_ids: users }),
            });
            msg("Shift saved.", true);
          };

          tr.querySelector('[data-act="delete"]').onclick = async () => {
            if (!confirm("Delete this shift?")) return;
            await api(`/api/shift/${i}`, { method: "DELETE" });
            msg("Shift removed.", true);
            await loadAll();
          };
        });

        // Volunteers
        const v = el("vol-list");
        v.innerHTML = "";
        volunteers.forEach((id) => {
          const chip = document.createElement("span");
          chip.className = "chip";
          const name = organizers.find((o) => o.id === id)?.name || id;
          chip.textContent = name;
          const x = document.createElement("button");
          x.textContent = "×";
          x.onclick = async () => {
            await api(`/api/volunteers/${id}`, { method: "DELETE" });
            msg("Volunteer removed.", true);
            await loadAll();
          };
          chip.appendChild(x);
          v.appendChild(chip);
        });
      }

      function renderUsers(cell, ids, shiftIdx) {
        cell.innerHTML = "";
        ids.forEach((uid) => {
          const chip = document.createElement("span");
          chip.className = "chip";
          chip.textContent = organizers.find((o) => o.id === uid)?.name || uid;
          const x = document.createElement("button");
          x.textContent = "×";
          x.onclick = () => {
            shifts[shiftIdx].user_ids = ids.filter((u) => u !== uid);
            renderUsers(cell, shifts[shiftIdx].user_ids, shiftIdx);
          };
          chip.appendChild(x);
          cell.appendChild(chip);
        });

        const sel = document.createElement("select");
        const base = document.createElement("option");
        base.textContent = "+ Add";
        base.value = "";
        sel.appendChild(base);
        organizers
          .filter((o) => !ids.includes(o.id))
          .forEach((o) => {
            const opt = document.createElement("option");
            opt.value = o.id;
            opt.textContent = o.name;
            sel.appendChild(opt);
          });
        sel.onchange = () => {
          if (!sel.value) return;
          shifts[shiftIdx].user_ids.push(sel.value);
          renderUsers(cell, shifts[shiftIdx].user_ids, shiftIdx);
        };
        cell.appendChild(sel);
      }

      // Controls
      el("reload").onclick = loadAll;
      el("add-shift").onclick = async () => {
        const now = Math.floor(Date.now() / 1000);
        const s = now + 3600;
        const e = s + 7200;
        await api("/api/shift", {
          method: "POST",
          body: JSON.stringify({ start: s, end: e, user_ids: [] }),
        });
        msg("Shift added.", true);
        await loadAll();
      };
      el("add-vol").onclick = async () => {
        const id = el("vol-id").value.trim();
        if (!id) return;
        await api("/api/volunteers", {
          method: "POST",
          body: JSON.stringify({ user_id: id }),
        });
        el("vol-id").value = "";
        msg("Volunteer added.", true);
        await loadAll();
      };
      el("export").onclick = () => {
        const blob = new Blob(
          [JSON.stringify({ volunteers, schedule: shifts }, null, 2)],
          { type: "application/json" },
        );
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "helpdesk-store.json";
        a.click();
      };
      el("save").onclick = async () => {
        await api("/api/schedule", {
          method: "POST",
          body: JSON.stringify(shifts),
        });
        msg("All changes saved.", true);
        await loadAll();
      };

      loadAll();
    </script>
  </body>
</html>
