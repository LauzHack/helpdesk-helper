services:
  lauzhack-bot:
    container_name: lauzhack-bot
    image: lauzhack-bot:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped

    ports:
      - "8080:8080"

    volumes:
      - ./data:/data

    user: "1000:1000"

    command: ["/usr/local/bin/lauzhack-bot", "/data/config.json"]
